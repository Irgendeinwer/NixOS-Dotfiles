name: "Nix Auto-Update (Manual Fallback)"

# Scheduled nightly updates run on junixsrv (nix-nightly-update.timer).
# Keep workflow_dispatch as a manual fallback when junixsrv is offline.
on:
  workflow_dispatch:

jobs:
  update:
    name: Update Flake Lockfile
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure private flake deploy keys
        env:
          WALLPAPER_DEPLOY_KEY: ${{ secrets.WALLPAPER_DEPLOY_KEY }}
          NIX_PRIVATE_DEPLOY_KEY: ${{ secrets.NIX_PRIVATE_DEPLOY_KEY }}
        run: |
          install -d -m 0700 "$HOME/.ssh"
          umask 077
          add_deploy_key() {
            local alias="$1" repo="$2" key_content="$3"
            local key_file="$HOME/.ssh/id_${alias}"
            [ -n "$key_content" ] || return 0
            printf '%s\n' "$key_content" > "$key_file"
            cat >> "$HOME/.ssh/config" <<EOF
          Host ${alias}
            HostName github.com
            User git
            IdentityFile ${key_file}
            IdentitiesOnly yes
            IdentityAgent none
            BatchMode yes
            StrictHostKeyChecking accept-new
          EOF
            git config --global --replace-all "url.ssh://git@${alias}/${repo}.insteadOf" "ssh://git@github.com/${repo}"
            git config --global --add "url.ssh://git@${alias}/${repo}.insteadOf" "git@github.com:${repo}"
          }
          add_deploy_key github-wallpaper Irgendeinwer/wallpaper "$WALLPAPER_DEPLOY_KEY"
          add_deploy_key github-nix-private Irgendeinwer/nix-private "$NIX_PRIVATE_DEPLOY_KEY"

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@e50d5f73bfe71c2dd0aa4218de8f4afa59f8f81d # v16

      - name: Update flake inputs
        run: nix flake update

      - name: Evaluate junixos
        run: nix eval .#nixosConfigurations.junixos.config.system.build.toplevel.drvPath --show-trace

      - name: Evaluate junixbook
        run: nix eval .#nixosConfigurations.junixbook.config.system.build.toplevel.drvPath --show-trace

      - name: Evaluate junixsrv
        run: nix eval .#nixosConfigurations.junixsrv.config.system.build.toplevel.drvPath --show-trace

      - name: Evaluate junixsrv container tarball
        run: nix eval .#nixosConfigurations.junixsrv.config.system.build.tarball.drvPath --show-trace

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@b863ae1933cb653a53c021fe36dbb774e1fb9403 # v5.2.0
        with:
          commit_message: "chore(flake): update inputs"
          file_pattern: "flake.lock"
